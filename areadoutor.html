<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Profissional - Pilates RENOVAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --renovar-primary: #2D5A27;
        }

        .sidebar-link:hover {
            background-color: #f0fdf4;
            color: var(--renovar-primary);
        }

        .sidebar-active {
            background-color: #f0fdf4;
            color: var(--renovar-primary);
            border-left: 4px solid var(--renovar-primary);
        }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="areadoutor.html" class="flex-shrink-0 flex items-center hover:opacity-80 transition">
                    <span class="text-2xl font-bold text-green-800 tracking-tighter">RENOVAR<span
                            class="text-green-500">.</span></span>
                </a>

                <div class="hidden md:flex space-x-8 font-medium text-gray-600">
                    <a href="planos-pacotes.html" class="hover:text-green-700 transition">Planos e Pacotes</a>
                    <a href="sobreempresa.html" class="hover:text-green-700 transition">Sobre</a>
                    <a href="estrutura.html" class="hover:text-green-700 transition">Unidades</a>
                    <a href="contatos.html" class="hover:text-green-700 transition">Contato</a>
                </div>

                <div class="flex items-center space-x-4 border-l pl-6 border-gray-100">
                    <a href="segurancadoutor.html" class="text-gray-400 hover:text-green-700">
                        <i class="fas fa-cog text-xl"></i>
                    </a>
                    <a href="perfildoutor.html"
                        class="flex items-center space-x-3 text-right hover:opacity-80 transition">
                        <div class="hidden sm:block leading-none">
                            <p id="user-name-display" class="text-sm font-black text-gray-800 italic">Dr. Othon Gustavo</p>
                            <p class="text-[10px] text-green-600 font-bold uppercase tracking-widest">Fisioterapeuta</p>
                        </div>
                        <img id="user-img-display" src="https://ui-avatars.com/api/?name=Othon+Gustavo&background=2D5A27&color=fff"
                            class="w-10 h-10 rounded-full border-2 border-green-50 shadow-sm">
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex flex-1 max-w-7xl mx-auto w-full">
        <aside class="w-64 bg-white shadow-sm hidden md:flex flex-col border-r border-gray-100 mt-6 rounded-tr-3xl">
            <nav class="mt-10 flex-1 px-4 space-y-2">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest px-4 mb-4">Gestão Clínica</p>

                <a href="areadoutor.html"
                    class="sidebar-active flex items-center px-4 py-3 text-sm font-bold rounded-xl transition">
                    <i class="fas fa-calendar-check mr-3 text-lg"></i> Ver Agenda
                </a>

                <a href="areadoutorprontuarios.html"
                    class="sidebar-link flex items-center px-4 py-3 text-sm font-medium text-gray-600 rounded-xl transition">
                    <i class="fas fa-notes-medical mr-3 text-lg"></i> Prontuários
                </a>

                <a href="areardoutorfinaceiro.html"
                    class="sidebar-link flex items-center px-4 py-3 text-sm font-medium text-gray-600 rounded-xl transition">
                    <i class="fas fa-chart-line mr-3 text-lg"></i> Financeiro
                </a>
            </nav>

            <div class="p-6 border-t border-gray-50">
                <a href="login.html" onclick="localStorage.removeItem('user');"
                    class="flex items-center px-4 py-2 text-sm font-bold text-red-500 hover:bg-red-50 rounded-xl transition">
                    <i class="fas fa-power-off mr-3"></i> Sair do Painel
                </a>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
                <div>
                    <h1 class="text-3xl font-black text-gray-800 tracking-tight">Agenda do Dia</h1>
                    <p class="text-gray-500 italic">Hoje, 11 de Março de 2026</p>
                </div>
                <div class="flex gap-4">
                    <div class="bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-100 text-center">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Atendimentos</p>
                        <p id="total-appointments-count" class="text-xl font-black text-green-700">00</p>
                    </div>
                    <div class="bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-100 text-center">
                        <p class="text-[10px] font-bold text-gray-400 uppercase">Restantes</p>
                        <p id="remaining-appointments-count" class="text-xl font-black text-orange-500">00</p>
                    </div>
                </div>
            </div>

                <div id="appointments-list" class="space-y-4">
                    <p class="text-center text-gray-400 py-10 italic">Carregando agenda...</p>
                </div>
            </div>
        </main>
    </div>

    <app-footer></app-footer>
    <script src="footer.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.protocol === 'file:') {
                alert('⚠️ Atenção: Para que o sistema funcione corretamente, você deve rodar o servidor (node server.js) e acessar via http://localhost:3000. Abrir o arquivo diretamente no navegador impede a conexão com o banco de dados.');
                return;
            }

            const userStr = localStorage.getItem('user');
            if (!userStr) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userStr);
            if (user.role !== 'doctor') {
                window.location.href = 'areaclienta.html';
                return;
            }

            // Update profile info
            document.querySelector('#user-name-display').innerText = `Dr. ${user.name}`;
            document.querySelector('#user-img-display').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=2D5A27&color=fff`;

            fetchAppointments(user.id);
        });

        async function fetchAppointments(doctorId) {
            try {
                const response = await fetch(`/appointments?doctorId=${doctorId}`);
                const data = await response.json();

                if (data.success) {
                    renderAppointments(data.data);
                } else {
                    console.error('Erro ao buscar agendamentos:', data.message);
                    document.getElementById('appointments-list').innerHTML = '<p class="text-center text-red-500 font-bold">Erro ao carregar agenda.</p>';
                }
            } catch (err) {
                console.error('Erro na requisição:', err);
                document.getElementById('appointments-list').innerHTML = '<p class="text-center text-red-500 font-bold">Erro de conexão.</p>';
            }
        }

        function renderAppointments(appointments) {
            const container = document.getElementById('appointments-list');
            const totalCountEl = document.getElementById('total-appointments-count');
            const remainingCountEl = document.getElementById('remaining-appointments-count');

            if (appointments.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-10 rounded-3xl shadow-sm border border-gray-100 text-center">
                        <i class="fas fa-calendar-times text-4xl text-gray-200 mb-4"></i>
                        <p class="text-gray-500 font-medium">Nenhum atendimento agendado para hoje.</p>
                    </div>
                `;
                totalCountEl.innerText = '0';
                remainingCountEl.innerText = '0';
                return;
            }

            container.innerHTML = '';
            
            // Format today's date for comparison
            const todayStr = new Date().toISOString().split('T')[0];
            const todayAppointments = appointments.filter(a => a.scheduled_at.startsWith(todayStr));
            
            totalCountEl.innerText = todayAppointments.length.toString().padStart(2, '0');
            
            // For "Remaining", let's assume those scheduled for later than now
            const now = new Date();
            const remainingAppointments = todayAppointments.filter(a => new Date(a.scheduled_at) > now);
            remainingCountEl.innerText = remainingAppointments.length.toString().padStart(2, '0');

            appointments.forEach(appo => {
                const date = new Date(appo.scheduled_at);
                const hour = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
                const isNow = Math.abs(date - now) < 1800000; // Within 30 mins

                const card = document.createElement('div');
                card.className = isNow 
                    ? "bg-green-700 p-6 rounded-3xl shadow-xl shadow-green-100 flex flex-col md:flex-row items-center gap-6 text-white transform scale-[1.02]"
                    : "bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col md:flex-row items-center gap-6 hover:border-green-300 transition group";
                
                card.innerHTML = `
                    <div class="text-center md:border-r md:pr-6 ${isNow ? 'border-green-600' : 'border-gray-100'}">
                        <p class="text-2xl font-black ${isNow ? '' : 'text-gray-800'}">${hour}</p>
                        <p class="text-[10px] font-bold ${isNow ? 'text-green-200 uppercase tracking-widest italic' : 'text-gray-400 uppercase'}">${isNow ? 'Agora' : 'Início'}</p>
                    </div>

                    <div class="flex-1">
                        <div class="flex items-center gap-2">
                            <h3 class="text-lg font-bold ${isNow ? '' : 'text-gray-800'}">${appo.client_name}</h3>
                            <span class="${isNow ? 'bg-white text-green-700' : 'bg-green-100 text-green-700'} text-[10px] font-black px-2 py-0.5 rounded uppercase italic">Confirmado</span>
                        </div>
                        <p class="text-sm ${isNow ? 'text-green-100' : 'text-gray-500'} font-medium">${appo.service_type} - <span class="${isNow ? 'text-white font-bold' : 'text-green-700'}">Prontuário #${appo.client_id}</span></p>
                    </div>

                    <div class="flex gap-2">
                        <a href="areadoutorprontuariospaciente.html?id=${appo.client_id}"
                            class="${isNow ? 'bg-white text-green-700' : 'bg-gray-900 text-white'} px-4 py-2 rounded-xl text-xs font-bold hover:opacity-90 transition">
                            <i class="fas fa-file-medical mr-1"></i> Abrir Prontuário
                        </a>
                        <button class="${isNow ? 'bg-green-600 text-white' : 'bg-gray-50 text-gray-400'} p-2 rounded-xl hover:text-green-700 transition">
                            <i class="fas fa-ellipsis-h"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
    <app-footer></app-footer>
    <script src="footer.js"></script>
</body>

</html>
