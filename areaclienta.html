<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Agendamentos - Pilates RENOVAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --renovar-primary: #2D5A27;
        }

        .sidebar-link:hover {
            background-color: #f0fdf4;
            color: var(--renovar-primary);
        }

        .sidebar-active {
            background-color: #f0fdf4;
            color: var(--renovar-primary);
            border-left: 4px solid var(--renovar-primary);
        }
    </style>
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="flex-shrink-0 flex items-center hover:opacity-80 transition">
                    <span class="text-2xl font-bold text-green-800 tracking-tighter">RENOVAR<span
                            class="text-green-500">.</span></span>
                </a>
                <div class="hidden md:flex space-x-8 font-medium text-gray-600">
                    <a href="planos-pacotes.html" class="hover:text-green-700 transition">Planos e Pacotes</a>
                    <a href="sobreempresa.html" class="hover:text-green-700 transition">Sobre</a>
                    <a href="estrutura.html" class="hover:text-green-700 transition">Unidades</a>
                    <a href="contatos.html" class="hover:text-green-700 transition">Contato</a>
                </div>
                <div class="flex items-center space-x-4 border-l pl-6 border-gray-100">
                    <a href="seguranca.html" class="text-gray-400 hover:text-green-700"><i
                            class="fas fa-cog text-xl"></i></a>
                    <div class="flex items-center space-x-3">
                        <a href="perfil.html" class="flex items-center space-x-3 hover:opacity-80 transition">
                            <div class="text-right hidden sm:block leading-none">
                                <p id="user-name-display" class="text-sm font-bold text-gray-800">Carregando...</p>
                                <p class="text-[10px] text-green-600 font-bold uppercase">Cliente</p>
                            </div>
                            <img id="img-user-display"
                                src="https://ui-avatars.com/api/?name=User&background=2D5A27&color=fff"
                                class="w-10 h-10 rounded-full border border-gray-200">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex flex-1 max-w-7xl mx-auto w-full">
        <aside class="w-64 bg-white shadow-sm hidden md:flex flex-col border-r border-gray-100 mt-6 rounded-tr-2xl">
            <nav class="mt-8 flex-1 px-4 space-y-2">
                <a href="areaclienta.html"
                    class="sidebar-active flex items-center px-4 py-3 text-sm font-bold rounded-xl transition">
                    <i class="fas fa-calendar-alt mr-3 text-lg"></i> Ver Agendar
                </a>
                <a href="agendaconsultacliente.html"
                    class="sidebar-link flex items-center px-4 py-3 text-sm font-medium text-gray-600 rounded-xl transition">
                    <i class="fas fa-plus-circle mr-3 text-lg"></i> Agendar Consulta
                </a>
                <a href="extratocliente.html"
                    class="sidebar-link flex items-center px-4 py-3 text-sm font-medium text-gray-600 rounded-xl transition">
                    <i class="fas fa-file-invoice-dollar mr-3 text-lg"></i> Extrato
                </a>
                <a href="login.html"
                    class="sidebar-link flex items-center px-4 py-3 text-sm font-medium text-red-600 rounded-xl transition mt-auto">
                    <i class="fas fa-power-off mr-3 text-lg"></i> Sair
                </a>
            </nav>
        </aside>

        <main class="flex-1 p-6 md:p-10">
            <div class="mb-10">
                <h1 class="text-3xl font-black text-gray-800 tracking-tight">Minha Agenda</h1>
                <p class="text-gray-500">Visualize todas as suas próximas sessões marcadas.</p>
            </div>

            <div id="credits-section" class="mb-10 hidden">
                <h2 class="text-sm font-black text-blue-700 uppercase tracking-widest mb-4 flex items-center">
                    <span class="w-2 h-2 bg-blue-700 rounded-full mr-2"></span> Meus Créditos
                </h2>
                <div id="credits-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cards de crédito serão inseridos aqui -->
                </div>
            </div>

            <div class="space-y-10">
                <div>
                    <h2 class="text-sm font-black text-green-700 uppercase tracking-widest mb-4 flex items-center">
                        <span class="w-2 h-2 bg-green-700 rounded-full mr-2"></span> Esta Semana
                    </h2>

                    <div id="weekly-appointments" class="space-y-4">
                        <p class="text-sm text-gray-400 italic">Carregando...</p>
                    </div>
                </div>

                <div>
                    <h2 class="text-sm font-black text-gray-400 uppercase tracking-widest mb-4 flex items-center">
                        <span class="w-2 h-2 bg-gray-300 rounded-full mr-2"></span> Todas as Consultas
                    </h2>

                    <div class="bg-white rounded-3xl overflow-hidden border border-gray-100 shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <tbody id="all-appointments-table" class="divide-y divide-gray-50">
                                <!-- Filas de agendamentos -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <app-footer></app-footer>
    <script src="footer.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.protocol === 'file:') {
                alert('⚠️ Atenção: Para que o sistema funcione corretamente, você deve rodar o servidor (node server.js) e acessar via http://localhost:3000. Abrir o arquivo diretamente no navegador impede a conexão com o banco de dados.');
                return;
            }

            const userStr = localStorage.getItem('user');
            if (!userStr) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userStr);
            document.getElementById('user-name-display').innerText = user.name;
            document.getElementById('img-user-display').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=2D5A27&color=fff`;

            fetchClientAppointments(user.id);
            fetchClientCredits(user.id);
        });

        async function fetchClientCredits(clientId) {
            try {
                const response = await fetch(`/client/credits?clientId=${clientId}`);
                const data = await response.json();
                if (data.success && data.credits.length > 0) {
                    document.getElementById('credits-section').classList.remove('hidden');
                    renderCredits(data.credits);
                }
            } catch (err) { console.error('Erro ao buscar créditos:', err); }
        }

        function renderCredits(credits) {
            const container = document.getElementById('credits-container');
            container.innerHTML = '';
            
            credits.forEach(batch => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition duration-300";
                
                const date = new Date(batch.valid_until).toLocaleDateString('pt-BR');
                let typeLabel = 'Crédito';
                let typeColor = 'text-gray-600';
                let icon = 'fa-ticket-alt';

                if (batch.type === 'pacote_mensal') {
                    typeLabel = 'Pacote Mensal';
                    typeColor = 'text-blue-600';
                    icon = 'fa-calendar-check';
                } else if (batch.type === 'avulso') {
                    typeLabel = 'Crédito Avulso';
                    typeColor = 'text-purple-600';
                    icon = 'fa-star';
                } else if (batch.type === 'promocional') {
                    typeLabel = 'Promocional (Gympass)';
                    typeColor = 'text-orange-600';
                    icon = 'fa-bolt';
                }
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[10px] font-black uppercase px-2 py-1 bg-gray-50 rounded-lg ${typeColor}">${typeLabel}</span>
                        <i class="fas ${icon} ${typeColor} opacity-20 text-xl"></i>
                    </div>
                    <div class="flex items-end justify-between">
                        <div>
                            <p class="text-3xl font-black text-gray-800">${batch.available_credits}<span class="text-xs text-gray-400 font-bold ml-1">/ ${batch.total_credits}</span></p>
                            <p class="text-[10px] text-gray-400 font-bold mt-1 uppercase">Expira em: ${date}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function fetchClientAppointments(clientId) {
            try {
                const response = await fetch(`/appointments?clientId=${clientId}`);
                const data = await response.json();

                if (data.success) {
                    renderClientAppointments(data.data);
                } else {
                    console.error('Erro:', data.message);
                }
            } catch (err) {
                console.error('Erro na requisição:', err);
            }
        }

        function renderClientAppointments(appointments) {
            const weeklyContainer = document.getElementById('weekly-appointments');
            const allTable = document.getElementById('all-appointments-table');

            if (appointments.length === 0) {
                weeklyContainer.innerHTML = '<p class="text-sm text-gray-500 italic">Você não possui consultas marcadas.</p>';
                allTable.innerHTML = '<tr><td class="px-6 py-10 text-center text-gray-400">Nenhum registro encontrado.</td></tr>';
                return;
            }

            weeklyContainer.innerHTML = '';
            allTable.innerHTML = '';

            const today = new Date();
            const startOfWeek = new Date(today);
            startOfWeek.setDate(today.getDate() - today.getDay());
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);

            appointments.forEach(appo => {
                const date = new Date(appo.scheduled_at);
                const day = date.getDate().toString().padStart(2, '0');
                const monthName = date.toLocaleString('pt-BR', { month: 'short' }).replace('.', '');
                const fullDate = date.toLocaleDateString('pt-BR');
                const hour = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0') + 'h';
                const weekDay = date.toLocaleString('pt-BR', { weekday: 'long' });

                if (date >= startOfWeek && date <= endOfWeek) {
                    const weeklyCard = document.createElement('div');
                    weeklyCard.className = "bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex items-center gap-6 hover:shadow-md transition";
                    weeklyCard.innerHTML = `
                        <div class="bg-green-700 text-white w-16 h-16 rounded-xl flex flex-col items-center justify-center">
                            <span class="text-xs font-bold uppercase">${monthName}</span>
                            <span class="text-xl font-black leading-none">${day}</span>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-extrabold text-gray-800">${appo.service_type}</h3>
                            <p class="text-sm text-gray-500 italic"><i class="far fa-clock mr-1"></i> ${hour} - ${weekDay}</p>
                            <p class="text-[10px] text-green-700 font-bold uppercase mt-1">Profissional: ${appo.doctor_name}</p>
                        </div>
                        <div class="text-right">
                            <span class="bg-green-100 text-green-700 text-[10px] font-bold px-2 py-1 rounded uppercase">Confirmado</span>
                        </div>
                    `;
                    weeklyContainer.appendChild(weeklyCard);
                }

                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50 transition cursor-default";
                row.innerHTML = `
                    <td class="px-6 py-4 font-bold text-gray-800">${fullDate.split('/')[0]}/${fullDate.split('/')[1]}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 font-medium capitalize">${weekDay}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 font-bold">${hour}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${appo.service_type}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="requestCancel(${appo.id})" class="text-gray-300 hover:text-red-500" title="Cancelar"><i class="fas fa-trash-alt"></i></button>
                    </td>
                `;
                allTable.appendChild(row);
            });

            if (weeklyContainer.innerHTML === '') {
                weeklyContainer.innerHTML = '<p class="text-sm text-gray-500 italic">Nenhuma consulta para esta semana.</p>';
            }
        }

        async function requestCancel(id) {
            if (!confirm('Deseja realmente cancelar esta consulta?')) return;
            try {
                const response = await fetch(`/appointments/${id}/cancel`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    alert(data.refunded ? 'Consulta cancelada e crédito estornado!' : 'Consulta cancelada. (Atenção: Crédito não estornado devido ao prazo de 24h)');
                    location.reload();
                } else {
                    alert('Erro ao cancelar: ' + data.message);
                }
            } catch (err) { console.error('Erro na requisição:', err); }
        }
    </script>
</body>

</html>
